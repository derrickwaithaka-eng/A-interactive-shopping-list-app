<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shopping List</h1>
        
        <!-- Input Form -->
        <div class="input-section">
            <input type="text" id="item-input" placeholder="Item name (e.g., Apples)">
            <input type="number" id="price-input" placeholder="Price ($)" step="0.01" min="0">
            <button id="add-btn">Add Item</button>
        </div>

        <!-- List Container -->
        <ul id="shopping-list"></ul>

        <!-- Footer / Controls -->
        <div class="footer-section">
            <div class="total-display">
                Total Cost: $<span id="total-cost">0.00</span>
            </div>
            <button id="clear-btn">Clear List</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
